name: SauceDemo QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Check Gherkin step discovery
        run: npm run bdd:dry
        env:
          REPORT_DIR: reports/dry
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run headless smoke on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:smoke:headless
      - name: Run the full headless suite on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:full:headless
      - name: Upload available failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: saucedemo-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
